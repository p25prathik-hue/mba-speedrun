[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrun"
version = "0.1.0"
description = "MBA Speedrun: personalised learning roadmaps as a Sequential Ordering Problem (OML, IIM Ahmedabad)"
requires-python = ">=3.9"
dependencies = ["pulp==2.9.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
license = {text = "MIT"}

[project.scripts]
speedrun = "speedrun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
